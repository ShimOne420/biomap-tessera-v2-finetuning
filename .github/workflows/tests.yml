# CPU CI: test real setup on Windows; parity/gradients/resume on both OS. No CUDA claim.
name: tests
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Setup Windows documented environment
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          .\scripts\setup_windows.ps1 -CpuOnly -DataRoot "$env:RUNNER_TEMP\biomap-data"
      - name: Install Linux CPU environment
        if: runner.os == 'Linux'
        run: |
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-lock.txt
          python -m pip install -e . --no-deps --no-build-isolation
          python -m pip check
      - name: Test Windows
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\.venv\Scripts\python.exe -m pytest
          if ($LASTEXITCODE -ne 0) { throw 'pytest failed' }
          & .\.venv\Scripts\python.exe scripts\probe_bii.py --help
          if ($LASTEXITCODE -ne 0) { throw 'CLI failed' }
      - name: Test Linux
        if: runner.os == 'Linux'
        run: |
          python -m pytest
          python scripts/probe_bii.py --help
