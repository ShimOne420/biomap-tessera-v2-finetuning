# Quattro configurazioni neurali prefissate; selezione solo validation macro-AOI.
seed: 42
threads: 4
batch_size: 256
epochs: 150
patience: 15
min_delta: 0.00001
learning_rate: 0.001
weight_decay: 0.01
dropout: 0.1
channels: [8, 16]
kernels: [5, 3]
pool_size: 8
dense_width: 32
mlp_width: null # calcolato per avvicinare il budget parametri della Conv1D
outputs: [identity, sigmoid]
models: [Conv1D, MLP]
baselines: [DummyMean, Ridge, HistGB]
