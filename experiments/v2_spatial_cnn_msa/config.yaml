# Esperimento V2 spatial: stessa CNN/celle/patch/maschere/split/target dell'Esperimento B (V1 spatial),
# valori dei pixel = embedding TESSERA V2 (student medium) per pixel, estratti da r2-fast sul reticolo V1.
# Le tile V1 servono solo per griglia, centri dei pixel e maschera di validità (identica a B).
data:
  year: 2020
  channels: 128
  source_version: '1.0'
  source_variant: vultr
  source_url: https://data.source.coop/tessera/tessera/npy/v1
  landmask_url: https://data.source.coop/tessera/tessera/landmasks/v1
  # Radice con <aoi>/tessera/2020; null usa i download privati nella work-root.
  v1_root: null
  # Work-root r2-fast con pixel_embeddings/<aoi>/<tile>.npy (+ .json con SHA256 e identità).
  v2_root: null
  encoder: tessera_v2_medium
  v2_protocol: dense127909-stream-legacy-exact-r2-fast
  # Solo test end-to-end sintetici; null nel run reale (manifest congelato 127.909 + 4.991).
  membership_csv: null
  # Reference del dense_campaign esistente (sola lettura), oppure CSV cell_id,target.
  reference: null
  targets_csv: null
  min_valid_fraction: 0.8
  max_patch_side: 64  # solo suddivisione di finestre grandi, mai resizing
  allow_partial_cells: false
  source_mmap_limit: 8
sampling:
  # Scelta geografica deterministica, senza consultare target o metriche.
  pilot_per_aoi: 50
  pilot_liguria: 150
  intermediate_per_aoi: 500
  intermediate_liguria: 1500
storage:
  max_gib: 60
  reserve_gib: 20
model:
  conv_channels: [64, 32]
  hidden: 64
  dropout: 0.1
  pooling: mean  # mean pesata sui pixel; max è una variante esplicita
  output: linear  # niente clipping; sigmoid è alternativa da scegliere solo sulla CV
training:
  seed: 42
  device: cuda:0
  batch_cells: 16
  epochs: 150
  patience: 15
  learning_rate: 0.001
  weight_decay: 0.0001
  clip_grad: 1.0
  # Solo esecuzione: i worker leggono e normalizzano le patch; l'ordine dei batch e i semi restano quelli
  # del processo principale (verificato da test: stessi pesi con 0 o N worker).
  num_workers: 4
  prefetch_factor: 4
  pin_memory: true
  mixed_precision: false
  models: [mean_histgb, mean_mlp, spatial_cnn]
  histgb:
    max_iter: 90
    max_leaf_nodes: 15
    learning_rate: 0.05
    l2_regularization: 1.0
    early_stopping: true
    random_state: 20260925
