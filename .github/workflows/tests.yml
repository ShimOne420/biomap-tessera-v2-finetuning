# Scopo: test CPU unificati/import su runner standard, senza dati, GPU o credenziali.
# Fasi: Python 3.12 -> setup privato -> import -> pytest inclusa CNN V1 e contratto r1.
# Input: codice PR verso main; output: log e riepilogo pytest. Nessun artefatto dati caricato.
# Risorse: massimo 20 minuti/job; concurrency cancella solo workflow superati della stessa PR.
# Ripresa: nuovo push rilancia la suite; non usa runner universitari o cache di produzione.
name: tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cpu-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  cpu:
    name: CPU (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      MPLBACKEND: Agg
      MPLCONFIGDIR: ${{ github.workspace }}/.pytest_cache/mpl
      CUDA_VISIBLE_DEVICES: ''
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      DEV_PYTHON: ${{ startsWith(matrix.os, 'windows') && '.venv-dev/Scripts/python.exe' || '.venv-dev/bin/python' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-lock.txt
            requirements-dev.txt
            scripts/setup_dev.py
      - name: Install isolated CPU development environment
        run: python scripts/setup_dev.py
      - name: Check syntax, installed imports and CPU backward
        run: '"$DEV_PYTHON" scripts/check_dev_environment.py'
      - name: Run all CPU tests including Experiment B and r1 contract
        run: '"$DEV_PYTHON" -m pytest -ra'
